<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Download EconLand</title>
    <link rel="manifest" href="{{ url_for('manifest') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script>
        let deferredPrompt = null;

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('{{ url_for("service_worker") }}')
                    .catch((error) => console.error('Service worker registration failed:', error));
            });
        }

        window.addEventListener('beforeinstallprompt', (event) => {
            event.preventDefault();
            deferredPrompt = event;
            const installButton = document.getElementById('installButton');
            if (installButton) {
                installButton.style.display = 'inline-block';
            }
        });

        function installPWA() {
            if (!deferredPrompt) {
                alert('This browser does not currently support install prompts. Try Chrome or Edge on localhost or HTTPS.');
                return;
            }

            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((choiceResult) => {
                if (choiceResult.outcome === 'accepted') {
                    console.log('PWA install accepted');
                } else {
                    console.log('PWA install dismissed');
                }
                deferredPrompt = null;
            });
        }
    </script>
    <style>
        .nav {
            justify-content: left ;
        }
        .nav ol li {
            color:white ;
            font-size: larger;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="nav">
            <h1>Download Latest Version</h1>
            <ol type="1">
                <li>There are no bugs</li>
                <br>
                <li>Most stable version </li>
                <br>
                <li>Good connectivity with the DataBase</li>
                <br>
                <li>Most supported Version</li>
            </ol>
            <h1><button id="installButton" onclick="installPWA()" style="display:none;">INSTALL</button></h1>
        </div>
    </div>
</body>
</html>
